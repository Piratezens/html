<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table</title>
    <style>
        table{
            width: 100%;
            border-collapse: collapse;
        text-align:center;
        color:rgb(118, 24, 24);
    
        }


        td , th{
            border: 1px solid black;
            padding: 10px;
        }
        tr{
            background-color:#4141;
        }
        tr:nth-child(even){
            background-color: rgba(7, 7, 6, 0.564);
        }
    </style>
</head>
<body>
    
    <table>
        <tr>
            <th>coutry</th>
            <th>country code</th>
            <th>Email</th>
        </tr>
        <tr>
            <td>USA</td>
            <td>US</td>
            <td>usa@example.com</td>
            
        </tr>
        <tr>
            <td>INDIA</td>
            <td>IN</td>
            <td>india@example.com</td>

        </tr>
    </table>
</body>
</html>
